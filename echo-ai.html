<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Эхо-ИИ (Локально)</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141b33;
      --panel-2: #1a2344;
      --text: #e5ecff;
      --muted: #97a5d8;
      --accent: #6ee7ff;
      --accent-2: #8b5cf6;
      --danger: #ff6b8a;
      --ok: #37d399;
      --shadow: 0 12px 40px rgba(0,0,0,.35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(1200px 700px at 15% -10%, #283562 0%, transparent 40%),
                  radial-gradient(900px 500px at 90% 10%, #2b2d77 0%, transparent 45%),
                  var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px 16px 26px;
    }
    .card {
      background: linear-gradient(165deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border: 1px solid rgba(255,255,255,.09);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .head { padding: 18px 18px 8px; }
    h1 { font-size: clamp(1.3rem, 4.2vw, 1.9rem); margin: 0 0 8px; }
    .subtitle { color: var(--muted); margin: 0; line-height: 1.4; font-size: .95rem; }

    .wave-wrap { padding: 12px 12px 0; }
    canvas {
      width: 100%;
      height: 160px;
      display: block;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(255,255,255,.08);
    }

    .controls {
      display: grid;
      gap: 10px;
      padding: 14px 14px 18px;
    }
    button {
      appearance: none;
      border: 0;
      color: #051122;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 14px;
      padding: 14px 16px;
      background: linear-gradient(145deg, var(--accent), #66b3ff);
      box-shadow: 0 8px 25px rgba(88,175,255,.35);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .12s ease, filter .2s ease;
    }
    button:active { transform: translateY(1px) scale(.995); }
    button[aria-pressed="true"] {
      background: linear-gradient(145deg, var(--danger), #ff3f6f);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 64, 120, .35);
    }
    .status {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.08);
      font-size: .95rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .status strong { color: var(--ok); }
    .status.error strong { color: var(--danger); }
    .kv { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <header class="head">
        <h1>Эхо-ИИ</h1>
        <p class="subtitle">Локальная голосовая петля: распознавание → мини-нейросеть (в Web Worker) → ответ голосом.</p>
      </header>

      <div class="wave-wrap">
        <canvas id="wave" width="720" height="160" aria-label="Визуализация волны"></canvas>
      </div>

      <div class="controls">
        <button id="listenBtn" aria-pressed="false">Слушать</button>
        <div id="status" class="status" role="status" aria-live="polite">
          <strong>Готово.</strong> Нажмите «Слушать».
        </div>
      </div>
    </section>
  </main>

<script>
(() => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  const btn = document.getElementById('listenBtn');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');

  const state = {
    listening: false,
    text: '',
    energy: 0,
    energyTarget: 0,
    epoch: 0,
    confidence: 0,
    workerReady: false,
    pendingRecognitionResult: null,
  };

  function setStatus(text, isError = false) {
    statusEl.classList.toggle('error', isError);
    statusEl.innerHTML = text;
  }

  if (!SpeechRecognition || !synth) {
    setStatus('<strong>Ошибка.</strong> В браузере нет нужных API (SpeechRecognition/speechSynthesis).', true);
    btn.disabled = true;
    return;
  }

  const workerCode = `
    const N = 24;
    const OUT = 12;
    const W1 = Array.from({length:N}, (_,i) =>
      Array.from({length:N}, (_,j) => ((Math.sin((i+1)*(j+3))*0.5)+0.5) * 0.2)
    );
    const W2 = Array.from({length:OUT}, (_,i) =>
      Array.from({length:N}, (_,j) => ((Math.cos((i+2)*(j+5))*0.5)+0.5) * 0.2)
    );
    const memory = Object.create(null);

    function tokenize(word) {
      const x = new Array(N).fill(0);
      const clean = (word || '').toLowerCase().trim();
      for (let i = 0; i < clean.length; i++) {
        const code = clean.charCodeAt(i);
        x[i % N] += ((code % 127) / 127);
      }
      return x;
    }
    function matVec(M, v) {
      const out = new Array(M.length).fill(0);
      for (let i = 0; i < M.length; i++) {
        let s = 0;
        const row = M[i];
        for (let j = 0; j < row.length; j++) s += row[j] * v[j];
        out[i] = s;
      }
      return out;
    }
    function relu(v) { for (let i=0;i<v.length;i++) v[i] = v[i] > 0 ? v[i] : 0; return v; }
    function softmax(v) {
      let max = -Infinity;
      for (let i=0;i<v.length;i++) if (v[i] > max) max = v[i];
      const ex = new Array(v.length);
      let sum = 0;
      for (let i=0;i<v.length;i++) { ex[i] = Math.exp(v[i]-max); sum += ex[i]; }
      for (let i=0;i<v.length;i++) ex[i] /= (sum || 1);
      return ex;
    }

    onmessage = (e) => {
      const { type, token } = e.data || {};
      if (type === 'process') {
        const x = tokenize(token);
        let h = matVec(W1, x);
        h = relu(h);
        let y = matVec(W2, h);
        y = softmax(y);

        const confidence = Math.max(...y);
        const key = (token || '').toLowerCase().trim();

        if (!memory[key]) memory[key] = 0;
        memory[key] += 1;

        const lr = 0.006;
        const reinforce = Math.min(memory[key], 15) / 15;
        for (let i = 0; i < W1.length; i++) {
          for (let j = 0; j < W1[i].length; j++) {
            W1[i][j] += lr * reinforce * x[j] * 0.05;
          }
        }
        for (let i = 0; i < W2.length; i++) {
          for (let j = 0; j < W2[i].length; j++) {
            W2[i][j] += lr * reinforce * h[j] * 0.05;
          }
        }

        postMessage({
          type: 'done',
          token,
          confidence,
          epoch: memory[key],
          energy: confidence * (0.5 + reinforce)
        });
      }
    };
  `;

  const blob = new Blob([workerCode], { type: 'application/javascript' });
  const worker = new Worker(URL.createObjectURL(blob));
  state.workerReady = true;

  worker.onmessage = (e) => {
    const data = e.data || {};
    if (data.type !== 'done') return;

    state.epoch = data.epoch || 0;
    state.confidence = Number(data.confidence || 0);
    state.energyTarget = Math.min(1, Math.max(0.15, Number(data.energy || 0)));

    const heard = data.token || state.text || '';
    setStatus(
      `<strong>Распознано:</strong> <span class="mono">${escapeHtml(heard)}</span><br>` +
      `<span class="kv">Уверенность:</span> ${(state.confidence * 100).toFixed(1)}% · ` +
      `<span class="kv">Укреплений веса:</span> ${state.epoch}`
    );

    speak(heard);
  };

  const recognition = new SpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.continuous = false;

  recognition.onstart = () => {
    state.listening = true;
    btn.setAttribute('aria-pressed', 'true');
    btn.textContent = 'Стоп';
    setStatus('<strong>Слушаю...</strong> Произнесите одно слово.');
    state.energyTarget = 0.95;
  };

  recognition.onresult = (event) => {
    const result = event.results?.[0]?.[0];
    const transcript = (result?.transcript || '').trim().toLowerCase();
    state.text = transcript;

    if (!transcript) {
      setStatus('<strong>Ничего не распознано.</strong> Попробуйте еще раз.');
      return;
    }
    if (!state.workerReady) {
      setStatus('<strong>Ошибка.</strong> Worker не готов.', true);
      return;
    }
    worker.postMessage({ type: 'process', token: transcript });
    setStatus(`<strong>Обработка:</strong> <span class="mono">${escapeHtml(transcript)}</span> в нейросети...`);
  };

  recognition.onerror = (event) => {
    setStatus(`<strong>Ошибка распознавания:</strong> ${escapeHtml(event.error || 'unknown')}`, true);
  };

  recognition.onend = () => {
    state.listening = false;
    btn.setAttribute('aria-pressed', 'false');
    btn.textContent = 'Слушать';
    state.energyTarget = Math.max(state.energyTarget, 0.25);
  };

  btn.addEventListener('click', () => {
    if (state.listening) {
      recognition.stop();
      return;
    }
    try {
      recognition.start();
    } catch (err) {
      setStatus(`<strong>Ошибка запуска:</strong> ${escapeHtml(err.message || 'unknown')}`, true);
    }
  });

  function speak(text) {
    if (!text) return;
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;
    utterance.onstart = () => { state.energyTarget = 1; };
    utterance.onend = () => { state.energyTarget = 0.2; };
    synth.speak(utterance);
  }

  function drawWave(ts) {
    const w = canvas.width;
    const h = canvas.height;
    state.energy += (state.energyTarget - state.energy) * 0.08;

    ctx.clearRect(0, 0, w, h);

    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#69f0ff');
    grad.addColorStop(1, '#8b5cf6');

    ctx.lineWidth = 3;
    ctx.strokeStyle = grad;
    ctx.beginPath();

    const mid = h / 2;
    const amp = 8 + state.energy * 45;
    const freq = 0.018 + state.energy * 0.02;

    for (let x = 0; x < w; x++) {
      const y = mid
        + Math.sin(x * freq + ts * 0.004) * amp * 0.8
        + Math.sin(x * freq * 0.4 + ts * 0.0022) * amp * 0.35;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    requestAnimationFrame(drawWave);
  }
  requestAnimationFrame(drawWave);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }
})();
</script>
</body>
</html>
